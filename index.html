<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de E-books | Educación Digital Práctica</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    /* RESET & BASE STYLES */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      line-height: 1.6;
    }

    /* HERO SECTION CON VIDEO EN BUCLE */
    .hero-section {
      position: relative;
      width: 100%;
      height: 85vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      text-align: center;
      color: #ffffff;
    }

    .hero-video {
      position: absolute;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      transform: translate(-50%, -50%);
      object-fit: cover;
      z-index: 1;
    }

    .video-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.70);
      z-index: 2;
    }

    .hero-content {
      position: relative;
      z-index: 3;
      max-width: 850px;
      padding: 20px;
    }

    .badge-tag {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 6px 18px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 600;
      display: inline-block;
      margin-bottom: 20px;
      letter-spacing: 0.5px;
    }

    .hero-title {
      font-size: 2.8rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 15px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    .hero-subtitle {
      font-size: 1.2rem;
      color: #cbd5e1;
      margin-bottom: 30px;
      max-width: 650px;
      margin-left: auto;
      margin-right: auto;
    }

    .hero-cta {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 14px 28px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: #3b82f6;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
    }

    .btn-primary:hover {
      background: #2563eb;
      transform: translateY(-2px);
    }

    .btn-whatsapp {
      background: #25D366;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(37, 211, 102, 0.4);
    }

    .btn-whatsapp:hover {
      background: #1da851;
      transform: translateY(-2px);
    }

    /* SECCIÓN CATÁLOGO */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 20px;
    }

    .section-title {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 40px;
      color: #f1f5f9;
    }

    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .card img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      margin-bottom: 20px;
      object-fit: cover;
    }

    .card-title {
      font-size: 1.3rem;
      margin-bottom: 10px;
      color: #ffffff;
    }

    .card-price {
      font-size: 1.5rem;
      font-weight: 800;
      color: #38bdf8;
      margin: 15px 0;
    }

    /* RESPONSIVE DESIGN */
    @media (max-width: 768px) {
      .hero-title {
        font-size: 2rem;
      }
      .hero-subtitle {
        font-size: 1rem;
      }
      .hero-section {
        height: 90vh;
      }
    }
  </style>
</head>
<body>

  <section class="hero-section">
    <div class="video-overlay"></div>
    
    <video autoplay loop muted playsinline class="hero-video">
      <source src="video/video-hero.mp4" type="video/mp4">
      Tu navegador no soporta reproducción de video.
    </video>

    <div class="hero-content">
      <span class="badge-tag">🎓 Educación Digital Práctica</span>
      <h1 class="hero-title">Aprende Habilidades Clave con Nuestros E-books</h1>
      <p class="hero-subtitle">Descarga guías prácticas en PDF sobre negocios, tecnología y desarrollo. Estudia a tu ritmo en cualquier dispositivo.</p>
      
      <div class="hero-cta">
        <a href="#catalogo" class="btn btn-primary">Ver Catálogo Disponible</a>
        <a href="https://wa.me/573161079509?text=Hola,%20quiero%20información%20del%20catálogo%20de%20e-books" target="_blank" class="btn btn-whatsapp">
          💬 Consultar por WhatsApp
        </a>
      </div>
    </div>
  </section>

  <main class="container" id="catalogo">
    <h2 class="section-title">Nuestros E-books Disponibles</h2>
    
    <div class="catalog-grid" id="ebooks-container">
    </div>
  </main>

  <script>
    // Reemplaza estas dos constantes con tus credenciales de Supabase
    const SUPABASE_URL = 'https://kmhnfeqjjspzbfekzlnz.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_ps5LZJw82pRYojwsfKtM9A_Y8hc7DOQ';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function cargarEbooks() {
      const container = document.getElementById('ebooks-container');
      
      const { data: ebooks, error } = await supabaseClient
        .from('ebooks')
        .select('*')
        .eq('activo', true);

      if (error) {
        console.error('Error cargando e-books:', error);
        container.innerHTML = '<p>Ocurrió un error al cargar el catálogo.</p>';
        return;
      }

      if (!ebooks || ebooks.length === 0) {
        container.innerHTML = '<p>No hay e-books disponibles en este momento.</p>';
        return;
      }

      container.innerHTML = ebooks.map(item => `
        <div class="card">
          <div>
            <img src="${item.imagen_url || 'https://via.placeholder.com/300x400'}" alt="${item.titulo}">
            <h3 class="card-title">${item.titulo}</h3>
            <p style="color: #94a3b8; font-size: 0.9rem;">${item.subtitulo || ''}</p>
          </div>
          <div>
            <div class="card-price">$${Number(item.precio_cop).toLocaleString('es-CO')} COP</div>
            <a href="https://wa.me/573161079509?text=Hola,%20quiero%20comprar%20el%20ebook:%20${encodeURIComponent(item.titulo)}" 
               target="_blank" 
               class="btn btn-whatsapp" 
               style="width: 100%; justify-content: center;">
               Comprar por WhatsApp
            </a>
          </div>
        </div>
      `).join('');
    }

    // Ejecutar al cargar la página
    document.addEventListener('DOMContentLoaded', cargarEbooks);
  </script>

</body>
</html>
